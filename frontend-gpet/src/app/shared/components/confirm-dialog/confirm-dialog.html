<dialog
  #dialogEl
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="descId"
  (close)="aoFechar()"
  class="m-auto w-[min(92vw,28rem)] rounded-2xl border border-slate-200 bg-white p-6 text-slate-900 shadow-2xl"
>
  <h1 [id]="titleId" class="text-lg font-semibold text-slate-900">
    {{ titulo() }}
  </h1>
  <p [id]="descId" class="mt-2 text-sm leading-relaxed text-slate-600">
    {{ mensagem() }}
  </p>

  <div class="mt-6 flex flex-wrap justify-end gap-3">
    <button
      type="button"
      data-action="cancel"
      autofocus
      [disabled]="processando()"
      (click)="fecharComEscolha('cancel')"
      class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ textoCancelar() }}
    </button>
    <button
      type="button"
      data-action="confirm"
      [disabled]="processando()"
      (click)="fecharComEscolha('confirm')"
      [class]="
        variante() === 'danger'
          ? 'rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-60'
          : 'rounded-lg bg-blue-700 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-60'
      "
    >
      {{ processando() ? 'Processando...' : textoConfirmar() }}
    </button>
  </div>
</dialog>
