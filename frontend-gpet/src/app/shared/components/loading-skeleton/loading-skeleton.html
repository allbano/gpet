<div
  role="status"
  aria-live="polite"
  aria-busy="true"
  class="space-y-3"
>
  <span class="sr-only">{{ rotulo() }}</span>
  @for (item of itens(); track item) {
    <div
      data-skeleton-item
      class="h-24 animate-pulse rounded-xl border border-slate-200 bg-white p-4 shadow-xs"
    >
      <div class="h-4 w-1/3 rounded bg-slate-200"></div>
      <div class="mt-3 h-3 w-2/3 rounded bg-slate-100"></div>
      <div class="mt-2 h-3 w-1/2 rounded bg-slate-100"></div>
    </div>
  }
</div>
