<aside
  aria-live="polite"
  aria-label="Notificações do sistema"
  class="pointer-events-none fixed right-4 bottom-4 z-50 flex w-[min(92vw,24rem)] flex-col gap-2"
>
  @for (item of store.notifications(); track item.id) {
    <div
      class="pointer-events-auto flex items-start justify-between gap-3 rounded-xl border p-3.5 shadow-lg"
      [class]="classesParaTipo(item.tipo)"
    >
      <div class="text-sm">
        <p class="text-xs font-semibold uppercase tracking-wide opacity-80">
          {{ rotuloTipo(item.tipo) }}
        </p>
        <p class="mt-0.5 leading-snug">{{ item.mensagem }}</p>
      </div>
      <button
        type="button"
        [attr.aria-label]="'Fechar notificação: ' + item.mensagem"
        (click)="store.dismiss(item.id)"
        class="rounded-md px-2 py-1 text-xs font-semibold hover:bg-black/10"
      >
        Fechar
      </button>
    </div>
  }
</aside>
