<article
  class="flex h-full flex-col justify-between rounded-2xl border border-slate-200 bg-white p-5 shadow-xs transition hover:border-teal-300 hover:shadow-md"
>
  <div>
    <div class="flex flex-wrap items-center justify-between gap-2">
      <span
        class="inline-flex items-center rounded-md bg-teal-50 px-2.5 py-0.5 text-xs font-semibold text-teal-900"
      >
        {{ cartao().classificacao }}
      </span>
      <app-meio-badge [meio]="cartao().meio" />
    </div>

    <h2 class="mt-3 text-lg font-semibold leading-snug text-slate-900">
      <a
        [routerLink]="['/public/informativas/atividades', cartao().id]"
        class="hover:text-teal-700 hover:underline"
      >
        {{ cartao().titulo }}
      </a>
    </h2>

    <p class="mt-2 line-clamp-3 text-sm leading-relaxed text-slate-600">
      {{ cartao().descricao }}
    </p>
  </div>

  <div class="mt-5 flex items-center justify-between border-t border-slate-100 pt-3">
    <span class="font-mono text-[11px] text-slate-500" [title]="cartao().id">
      ID {{ cartao().id.slice(0, 8) }}…
    </span>
    <a
      [routerLink]="['/public/informativas/atividades', cartao().id]"
      class="inline-flex items-center gap-1 text-sm font-semibold text-teal-700 hover:text-teal-900"
    >
      Ver detalhes
      <span aria-hidden="true">→</span>
    </a>
  </div>
</article>
