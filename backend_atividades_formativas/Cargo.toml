[package]
name = "backend_atividades_formativas"
version = "0.1.0"
edition = "2024"

[features]
swagger = ["dep:utoipa-swagger-ui"]

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
mimalloc = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", optional = true, features = ["axum", "vendored", "debug-embed"] }
uuid = { version = "1", features = ["serde"] }
