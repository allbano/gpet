name: gpet-prod
services:
  pg18_atividades_formativas:
    image: postgres:18-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: gpet
      POSTGRES_DB: formativas
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_formativas_password
    volumes:
      - pgdata_formativas:/var/lib/postgresql
    networks: [banco_formativas]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
    secrets: [pg_formativas_password]

  backend_atividades_formativas:
    build:
      context: ../backend_atividades_formativas
      target: producao
    restart: unless-stopped
    depends_on:
      pg18_atividades_formativas:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gpet@pg18_atividades_formativas/formativas
      DATABASE_PASSWORD_FILE: /run/secrets/pg_formativas_password
    secrets: [pg_formativas_password]
    networks: [banco_formativas, gateway]

  pg18_atividades_informativas:
    image: postgres:18-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: gpet
      POSTGRES_DB: informativas
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_informativas_password
    volumes:
      - pgdata_informativas:/var/lib/postgresql
    networks: [banco_informativas]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
    secrets: [pg_informativas_password]

  backend_atividades_informativas:
    build:
      context: ../backend_atividades_informativas
      target: producao
    restart: unless-stopped
    depends_on:
      pg18_atividades_informativas:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gpet@pg18_atividades_informativas/informativas
      DATABASE_PASSWORD_FILE: /run/secrets/pg_informativas_password
    secrets: [pg_informativas_password]
    networks: [banco_informativas, gateway]

volumes:
  pgdata_formativas:
  pgdata_informativas:

networks:
  banco_formativas:
    internal: true
  banco_informativas:
    internal: true
  gateway:
    internal: true

secrets:
  pg_formativas_password:
    file: ${PG_FORMATIVAS_PASSWORD_FILE:?Informe o caminho do secret}
  pg_informativas_password:
    file: ${PG_INFORMATIVAS_PASSWORD_FILE:?Informe o caminho do secret}
