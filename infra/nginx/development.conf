map $uri $gpet_cache_control {
    default "no-store";
    ~*^/(main|styles|chunk|polyfills)-[a-zA-Z0-9_-]+\.(js|css)$ "public, max-age=31536000, immutable";
}
server {
    listen 80;
    server_name _;
    include /etc/nginx/gpet-security.conf;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /api { return 404; }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_intercept_errors off;
        proxy_buffering off;
    }
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
