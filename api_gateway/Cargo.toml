[package]
name = "api_gateway"
version = "0.1.0"
edition = "2024"

[features]
swagger = ["dep:utoipa-swagger-ui", "dep:serde_json"]

[dependencies]
async-trait = "0.1"
bytes = "1"
http = "1"
mimalloc = "0.1"
pingora = { version = "0.9", default-features = false, features = ["proxy"] }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros"] }
utoipa-swagger-ui = { version = "9", optional = true, default-features = false, features = ["vendored", "debug-embed"] }

[dev-dependencies]
axum = "0.8"
serde_json = "1"
