quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${GPET_DB_USER:gpet}
quarkus.datasource.password=${GPET_DB_PASSWORD:gpet-dev-only}
%prod.quarkus.datasource.jdbc.url=${GPET_DB_URL}
%prod.quarkus.datasource.password=${GPET_DB_PASSWORD}
%dev.quarkus.datasource.jdbc.url=${GPET_DB_URL:jdbc:postgresql://localhost:5432/gpet}
quarkus.datasource.devservices.image-name=postgres:18.6-alpine
quarkus.jooq.dialect=POSTGRES
quarkus.flyway.migrate-at-start=false
%dev.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.migrate-at-start=true
%prod.quarkus.http.access-log.enabled=true
quarkus.http.limits.max-body-size=64K
quarkus.http.proxy.proxy-address-forwarding=false
quarkus.smallrye-openapi.info-title=GPET API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
%prod.gpet.cookie-secure=${GPET_COOKIE_SECURE:true}
%dev.gpet.cookie-secure=false
%test.gpet.cookie-secure=false
quarkus.native.resources.includes=db/migration/*.sql
