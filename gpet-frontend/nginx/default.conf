map $uri $gpet_cache_control {
    default "no-store";
    ~*^/(main|styles|chunk|polyfills)-[a-zA-Z0-9_-]+\.(js|css)$ "public, max-age=31536000, immutable";
}
server {
    listen 80;
    server_name _;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/gpet-security.conf;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    location = /api { return 404; }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors off;
        proxy_buffering off;
    }
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
